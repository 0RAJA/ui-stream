name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install declared optional profiles
        run: python -m pip install '.[redis]'
      - name: Check macOS loopback bootstrap
        if: runner.os == 'macOS'
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_demo.StandaloneDemoTest.test_static_demo_assets_are_served_without_external_dependencies -v
      - name: Test source
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v

  distributions:
    name: Wheel, sdist, README and release scan
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install build and validation dependencies
        run: python -m pip install 'setuptools==80.9.0' build twine 'readme_renderer[md]' '.[redis]'
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m tools.verify_distribution --check-tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Bounded synthetic benchmark smoke
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m benchmarks.run --smoke --output "$RUNNER_TEMP/benchmark-smoke.json"
      - name: Check bilingual docs and static README links
        run: python -m tools.check_docs
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Validate PyPI README and metadata
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          import os
          from pathlib import Path
          from readme_renderer.markdown import render

          rendered = render(Path("README.pypi.md").read_text())
          assert rendered and "<img " in rendered and "<table" in rendered
          preview = Path(os.environ["RUNNER_TEMP"]) / "pypi-readme.html"
          preview.write_text('<!doctype html><meta charset="utf-8">' + rendered)
          PY
      - name: Scan source and actual archives
        run: python tools/check_release.py --project . --dist dist
      - name: Verify wheel, directory consumer and sdist rebuild
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m tools.verify_distribution --dist dist
      - name: Upload PyPI renderer preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-preview
          path: ${{ runner.temp }}/pypi-readme.html
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
