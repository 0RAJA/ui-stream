<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Three ports, host-owned durability</title><desc id="desc">Host calls Runtime; codec builds events; live publishes best effort; archive commits snapshots and results; UI reads both paths.</desc>
<rect width="1040" height="560" fill="#eef3f8"/>
<text x="24" y="30" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="24" fill="#18324f">Three ports, host-owned durability</text>
<text x="24" y="63" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="17" fill="#4c637b">Core coordinates; the host implements the ports.</text>
<rect x="24" y="234" width="160" height="88" rx="10" fill="white" stroke="#4c637b" stroke-width="1.5"/>
<text x="104.0" y="265.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="20" fill="#18324f">Host</text>
<text x="104.0" y="297.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" fill="#4c637b">send · finish</text>
<rect x="244" y="220" width="200" height="116" rx="10" fill="white" stroke="#285ac8" stroke-width="1.5"/>
<text x="344.0" y="265.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="20" fill="#285ac8">StreamRuntime</text>
<text x="344.0" y="297.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" fill="#4c637b">bounded coordination</text>
<rect x="504" y="98" width="216" height="88" rx="10" fill="white" stroke="#4c637b" stroke-width="1.5"/>
<text x="612.0" y="129.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="20" fill="#18324f">EventCodec</text>
<text x="612.0" y="161.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" fill="#4c637b">events + encoding</text>
<rect x="504" y="234" width="216" height="88" rx="10" fill="white" stroke="#4c637b" stroke-width="1.5"/>
<text x="612.0" y="265.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="20" fill="#18324f">LivePublisher</text>
<text x="612.0" y="297.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" fill="#4c637b">best-effort tail</text>
<rect x="504" y="406" width="216" height="88" rx="10" fill="white" stroke="#4c637b" stroke-width="1.5"/>
<text x="612.0" y="437.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="20" fill="#18324f">ArchiveStore</text>
<text x="612.0" y="469.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" fill="#4c637b">snapshot + result</text>
<rect x="840" y="234" width="176" height="88" rx="10" fill="white" stroke="#4c637b" stroke-width="1.5"/>
<text x="928.0" y="265.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="20" fill="#18324f">UI</text>
<text x="928.0" y="297.0" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" fill="#4c637b">observe + recover</text>
