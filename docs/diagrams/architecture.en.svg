<polygon points="504,142 496,138 496,146" fill="#285ac8"/>
<polyline points="444,278 504,278" fill="none" stroke="#285ac8" stroke-width="2"/>
<polygon points="504,278 496,274 496,282" fill="#285ac8"/>
<polyline points="444,316 472,316 472,450 504,450" fill="none" stroke="#285ac8" stroke-width="2"/>
<polygon points="504,450 496,446 496,454" fill="#285ac8"/>
<polyline points="720,278 840,278" fill="none" stroke="#285ac8" stroke-width="2"/>
<polygon points="840,278 832,274 832,282" fill="#285ac8"/>
<text x="780" y="259" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" fill="#4c637b">SSE / live</text>
