<polygon points="928,322 924,330 932,330" fill="#285ac8"/>
<text x="825" y="475" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" fill="#4c637b">latest snapshot</text>
<text x="24" y="530" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" fill="#4c637b">No complete replay or lossless reconnect guarantee.</text>
