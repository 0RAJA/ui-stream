<polyline points="300,492 930,492" fill="none" stroke="#285ac8" stroke-width="2"/>
<polygon points="930,492 922,488 922,496" fill="#285ac8"/>
<text x="615.0" y="475" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="14" fill="#4c637b">after_close(Summary) · once</text>
<polyline points="300,324 344,324 344,352 300,352" fill="none" stroke="#285ac8" stroke-width="2"/>
<polygon points="300,352 308,348 308,356" fill="#285ac8"/>
<text x="385" y="339" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="15" fill="#4c637b">close</text>
<text x="24" y="555" text-anchor="start" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="16" fill="#4c637b">commit 失败：保留 pending/open，不发终态、不通知。</text>
</svg>