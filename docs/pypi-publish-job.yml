# Reviewed activation patch: append this job under jobs in .github/workflows/release.yml
# only after the maintainer approves the pending publisher and pypi environment.
publish:
  name: Publish verified distributions to PyPI
  needs: verify
  runs-on: ubuntu-latest
  timeout-minutes: 10
  environment:
    name: pypi
    url: https://pypi.org/p/ui-stream
  permissions:
    contents: read
    id-token: write
  steps:
    - name: Download this run's verified distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: distributions
        path: dist
    - name: Publish to PyPI using Trusted Publishing
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
