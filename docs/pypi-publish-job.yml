# Publishing job reference; keep permissions and pinned actions aligned with release.yml.
publish:
  name: Publish verified distributions to PyPI
  needs: verify
  runs-on: ubuntu-latest
  timeout-minutes: 10
  environment:
    name: pypi
    url: https://pypi.org/p/ui-stream
  permissions:
    contents: read
    id-token: write
  steps:
    - name: Download this run's verified distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: distributions
        path: dist
    - name: Publish to PyPI using Trusted Publishing
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      env:
        SSL_CERT_FILE: /root/.local/lib/python3.13/site-packages/certifi/cacert.pem
        SSL_CERT_DIR: /root/.local/lib/python3.13/site-packages/certifi
        REQUESTS_CA_BUNDLE: /root/.local/lib/python3.13/site-packages/certifi/cacert.pem
